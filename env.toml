[device]
DEVICE_NAME = "bramble"
ROM_FAMILY = "grapheneos"
'GRAPHENEOS[UPDATE_CHANNEL]' = "stable"

# Used by .github/workflows/multi-release.yml when its devices input is empty.
# For rooted builds, append the Magisk preinit device to every entry.
# DEVICES = "bramble:sda10, shiba:sda10"

# The default is official Magisk from topjohnwu/Magisk.
# Override this only when intentionally selecting another Magisk fork.
# 'MAGISK[REPOSITORY]' = "topjohnwu/Magisk"

[build]
# Magisk is pinned deliberately for avbroot compatibility. Bump only after
# reviewing avbroot support and validating the target device/runtime path.
# MAGISK_VERSION = "v30.7"
# Legacy single-output switch: false = rootless, true = Magisk.
# ROOT = true
# Optional override: "rootless", "magisk", or "both".
# ROOT_MODE = "both"
# Required when ROOT_MODE includes Magisk.
# MAGISK_PREINIT = "sda10"
FORCE_UPDATE = false

# Module selections. Disabled options do not participate in acquisition/patching.
# 'ADDITIONALS[BCR]' = true
# 'ADDITIONALS[CUSTOTA]' = true
# 'ADDITIONALS[MSD]' = true
# 'ADDITIONALS[OEMUNLOCKONBOOT]' = true
# 'ADDITIONALS[DISABLE_SYSTEM_UPDATER]' = false
# 'ADDITIONALS[ALTERINSTALLER]' = true
# 'ADDITIONALS[BOOT_ANIMATION]' = false
# 'ADDITIONALS[FDROID_PRIVILEGED_EXTENSION]' = false

[github]
# PIXENEOS_RELEASE_OWNER = "0cwa"
# PIXENEOS_RELEASE_REPOSITORY = "PixeneOS"
# PIXENEOS_RELEASE_BASE_URL = "https://example.invalid/releases"
# PIXENEOS_AVBROOT_SETUP_SOURCE = "https://github.com/0cwa/my-avbroot-setup"
