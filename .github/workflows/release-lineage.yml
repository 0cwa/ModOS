name: Patch and Release LineageOS OTA

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      device-id:
        description: Device code name
        required: true
        default: "pdx235"
      root:
        description: Add root to the build (legacy boolean; ignored when root-mode is set)
        required: false
        type: boolean
        default: true
      root-mode:
        description: Optional root mode override (rootless, magisk, or both)
        required: false
        type: string
        default: ""
      magisk-preinit-device:
        description: Magisk preinit device
        required: false
        default: "sda47"
      update-channel:
        description: LineageOS update channel
        required: false
        default: "nightly"
      compatible-sepolicy-patching:
        description: Enable compatible SELinux patching
        required: false
        type: boolean
        default: true
      allow-unauthorized-adb:
        description: Enable unauthorized ADB for build-only debugging
        required: false
        type: boolean
        default: false
      disable-system-updater:
        description: Remove the stock ROM updater app (use with Custota)
        required: false
        type: boolean
        default: false
      boot-animation:
        description: Include the local custom boot animation
        required: false
        type: boolean
        default: false
      release-type:
        description: Release behavior
        required: true
        type: choice
        options:
          - default
          - build-only
          - force-publish
        default: default

permissions:
  contents: write

jobs:
  schedule_config:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      device_id: ${{ steps.definition.outputs.device_id }}
      rom_family: ${{ steps.definition.outputs.rom_family }}
      update_channel: ${{ steps.definition.outputs.update_channel }}
      root: ${{ steps.definition.outputs.root }}
      root_mode: ${{ steps.definition.outputs.root_mode }}
      afsr: ${{ steps.definition.outputs.afsr }}
      magisk_preinit_device: ${{ steps.definition.outputs.magisk_preinit_device }}
      alterinstaller: ${{ steps.definition.outputs.alterinstaller }}
      bcr: ${{ steps.definition.outputs.bcr }}
      custota: ${{ steps.definition.outputs.custota }}
      msd: ${{ steps.definition.outputs.msd }}
      oemunlockonboot: ${{ steps.definition.outputs.oemunlockonboot }}
      disable_system_updater: ${{ steps.definition.outputs.disable_system_updater }}
      fdroid_privileged_extension: ${{ steps.definition.outputs.fdroid_privileged_extension }}
      boot_animation: ${{ steps.definition.outputs.boot_animation }}
      compatible_sepolicy_patching: ${{ steps.definition.outputs.compatible_sepolicy_patching }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load scheduled build definition
        id: definition
        shell: bash
        env:
          SCHEDULE_DEFINITION: .github/schedules/lineageos-pdx235.toml
          EXPECTED_ROM_FAMILY: lineageos
        run: bash src/ci/load_schedule_definition.sh

  scheduled_build:
    if: github.event_name == 'schedule'
    needs: schedule_config
    uses: ./.github/workflows/build-rom.yml
    with:
      rom-family: ${{ needs.schedule_config.outputs.rom_family }}
      device-id: ${{ needs.schedule_config.outputs.device_id }}
      root: ${{ needs.schedule_config.outputs.root == 'true' }}
      root-mode: ${{ needs.schedule_config.outputs.root_mode }}
      afsr: ${{ needs.schedule_config.outputs.afsr == 'true' }}
      magisk-preinit-device: ${{ needs.schedule_config.outputs.magisk_preinit_device }}
      update-channel: ${{ needs.schedule_config.outputs.update_channel }}
      alterinstaller: ${{ needs.schedule_config.outputs.alterinstaller == 'true' }}
      bcr: ${{ needs.schedule_config.outputs.bcr == 'true' }}
      custota: ${{ needs.schedule_config.outputs.custota == 'true' }}
      msd: ${{ needs.schedule_config.outputs.msd == 'true' }}
      oemunlockonboot: ${{ needs.schedule_config.outputs.oemunlockonboot == 'true' }}
      disable-system-updater: ${{ needs.schedule_config.outputs.disable_system_updater == 'true' }}
      fdroid-privileged-extension: ${{ needs.schedule_config.outputs.fdroid_privileged_extension == 'true' }}
      compatible-sepolicy-patching: ${{ needs.schedule_config.outputs.compatible_sepolicy_patching == 'true' }}
      allow-unauthorized-adb: false
      boot-animation: ${{ needs.schedule_config.outputs.boot_animation == 'true' }}
      release-type: default
      publish: true
    secrets: inherit

  manual_build:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-rom.yml
    with:
      rom-family: lineageos
      device-id: ${{ inputs.device-id }}
      root: ${{ inputs.root }}
      root-mode: ${{ inputs.root-mode }}
      magisk-preinit-device: ${{ inputs.magisk-preinit-device }}
      update-channel: ${{ inputs.update-channel }}
      compatible-sepolicy-patching: ${{ inputs.compatible-sepolicy-patching }}
      allow-unauthorized-adb: ${{ inputs.allow-unauthorized-adb }}
      disable-system-updater: ${{ inputs.disable-system-updater }}
      boot-animation: ${{ inputs.boot-animation }}
      release-type: ${{ inputs.release-type }}
      publish: ${{ inputs.release-type != 'build-only' }}
    secrets: inherit
