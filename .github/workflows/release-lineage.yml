name: Patch and Release LineageOS OTA

on:
  schedule:
    - cron: "0 */6 * * *"
  # Publish LineageOS 24.0 nightlies on the existing six-hour schedule.
  # A purpose-named main merge also provides an explicit first-run trigger.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source-artifact-id:
        description: Optional encrypted artifact to transport only (no build or signing)
        required: false
        default: ""
      expected-source-zip-sha256:
        description: Required immutable ZIP digest for transport-only requests
        required: false
        default: ""
      device-id:
        description: Device code name
        required: true
        default: "pdx235"
      root:
        description: Add root to the build (legacy boolean; ignored when root-mode is set)
        required: false
        type: boolean
        default: true
      root-mode:
        description: Optional root mode override (rootless, magisk, or both)
        required: false
        type: string
        default: ""
      magisk-preinit-device:
        description: Magisk preinit device
        required: false
        default: "sda47"
      update-channel:
        description: LineageOS update channel
        required: false
        default: "nightly"
      compatible-sepolicy-patching:
        description: Enable compatible SELinux patching
        required: false
        type: boolean
        default: true
      allow-unauthorized-adb:
        description: Enable unauthorized ADB for build-only debugging
        required: false
        type: boolean
        default: false
      microg:
        description: Include locked official microG Services and Companion
        required: false
        type: boolean
        default: false
      disable-system-updater:
        description: Remove the stock ROM updater app (use with Custota)
        required: false
        type: boolean
        default: false
      boot-animation:
        description: Include the local custom boot animation
        required: false
        type: boolean
        default: true
      export-device-candidate:
        description: Export repository-signed development OTA ZIPs; optionally encrypt for a recipient
        required: false
        type: boolean
        default: false
      device-candidate-recipient-base64:
        description: Optional base64 public PEM certificate; leave empty for normal OTA ZIP artifacts
        required: false
        default: ""
      development-profile:
        description: Explicit build-only source experiment; production pins stay unchanged
        required: false
        type: choice
        default: none
        options:
          - none
          - care-map-pdx235
          - care-map-pdx235-lineage24
      signing-mode:
        description: Build-only signing identity; repository preserves existing device keys
        required: false
        type: choice
        default: disposable
        options:
          - disposable
          - repository
      release-type:
        description: Release behavior
        required: true
        type: choice
        options:
          - default
          - build-only
          - force-publish
        default: default

permissions:
  contents: read

jobs:
  schedule_config:
    if: "${{ github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(pdx235): 24.0 pilot')) }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      device_id: ${{ steps.definition.outputs.device_id }}
      rom_family: ${{ steps.definition.outputs.rom_family }}
      update_channel: ${{ steps.definition.outputs.update_channel }}
      root: ${{ steps.definition.outputs.root }}
      root_mode: ${{ steps.definition.outputs.root_mode }}
      afsr: ${{ steps.definition.outputs.afsr }}
      magisk_preinit_device: ${{ steps.definition.outputs.magisk_preinit_device }}
      alterinstaller: ${{ steps.definition.outputs.alterinstaller }}
      bcr: ${{ steps.definition.outputs.bcr }}
      custota: ${{ steps.definition.outputs.custota }}
      msd: ${{ steps.definition.outputs.msd }}
      oemunlockonboot: ${{ steps.definition.outputs.oemunlockonboot }}
      disable_system_updater: ${{ steps.definition.outputs.disable_system_updater }}
      microg: ${{ steps.definition.outputs.microg }}
      fdroid_privileged_extension: ${{ steps.definition.outputs.fdroid_privileged_extension }}
      boot_animation: ${{ steps.definition.outputs.boot_animation }}
      compatible_sepolicy_patching: ${{ steps.definition.outputs.compatible_sepolicy_patching }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load scheduled build definition
        id: definition
        shell: bash
        env:
          SCHEDULE_DEFINITION: .github/schedules/lineageos-pdx235.toml
          EXPECTED_ROM_FAMILY: lineageos
        run: bash src/ci/load_schedule_definition.sh

  scheduled_build:
    permissions:
      contents: write
    if: "${{ github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(pdx235): 24.0 pilot')) && inputs.source-artifact-id == '' }}"
    needs: schedule_config
    uses: ./.github/workflows/build-rom.yml
    with:
      rom-family: ${{ needs.schedule_config.outputs.rom_family }}
      device-id: ${{ needs.schedule_config.outputs.device_id }}
      root: ${{ needs.schedule_config.outputs.root == 'true' }}
      root-mode: ${{ needs.schedule_config.outputs.root_mode }}
      afsr: ${{ needs.schedule_config.outputs.afsr == 'true' }}
      magisk-preinit-device: ${{ needs.schedule_config.outputs.magisk_preinit_device }}
      update-channel: ${{ needs.schedule_config.outputs.update_channel }}
      alterinstaller: ${{ needs.schedule_config.outputs.alterinstaller == 'true' }}
      bcr: ${{ needs.schedule_config.outputs.bcr == 'true' }}
      custota: ${{ needs.schedule_config.outputs.custota == 'true' }}
      msd: ${{ needs.schedule_config.outputs.msd == 'true' }}
      oemunlockonboot: ${{ needs.schedule_config.outputs.oemunlockonboot == 'true' }}
      disable-system-updater: ${{ needs.schedule_config.outputs.disable_system_updater == 'true' }}
      microg: ${{ needs.schedule_config.outputs.microg == 'true' }}
      fdroid-privileged-extension: ${{ needs.schedule_config.outputs.fdroid_privileged_extension == 'true' }}
      compatible-sepolicy-patching: ${{ needs.schedule_config.outputs.compatible_sepolicy_patching == 'true' }}
      allow-unauthorized-adb: false
      boot-animation: ${{ needs.schedule_config.outputs.boot_animation == 'true' }}
      release-type: default
      publish: true
      pdx235-pilot-release: true
    secrets: inherit

  manual_build:
    if: github.event_name == 'workflow_dispatch' && inputs.release-type != 'build-only' && inputs.source-artifact-id == ''
    permissions:
      contents: write
    uses: ./.github/workflows/build-rom.yml
    with: &lineage-build-inputs
      rom-family: lineageos
      device-id: ${{ inputs.device-id }}
      root: ${{ inputs.root }}
      root-mode: ${{ inputs.root-mode }}
      magisk-preinit-device: ${{ inputs.magisk-preinit-device }}
      update-channel: ${{ inputs.update-channel }}
      compatible-sepolicy-patching: ${{ inputs.compatible-sepolicy-patching }}
      allow-unauthorized-adb: ${{ inputs.allow-unauthorized-adb }}
      microg: ${{ inputs.microg }}
      disable-system-updater: ${{ inputs.disable-system-updater }}
      boot-animation: ${{ inputs.boot-animation }}
      export-device-candidate: ${{ inputs.export-device-candidate }}
      device-candidate-recipient-base64: ${{ inputs.device-candidate-recipient-base64 }}
      development-profile: ${{ inputs.development-profile }}
      signing-mode: ${{ inputs.signing-mode }}
      release-type: ${{ inputs.release-type }}
      publish: ${{ inputs.release-type != 'build-only' }}
    secrets: inherit

  manual_build_only:
    if: github.event_name == 'workflow_dispatch' && inputs.release-type == 'build-only' && inputs.signing-mode != 'repository' && inputs.source-artifact-id == ''
    permissions:
      contents: read
    uses: ./.github/workflows/build-rom.yml
    with: *lineage-build-inputs

  manual_device_candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.release-type == 'build-only' && inputs.signing-mode == 'repository' && inputs.source-artifact-id == ''
    permissions:
      contents: read
    uses: ./.github/workflows/build-rom.yml
    with: *lineage-build-inputs
    # Preserve the installed signing identity without forwarding release/API
    # credentials. This prepares signing only; acquisition/postflight and the
    # publication quarantine remain unchanged.
    secrets:
      AVB_KEY: ${{ secrets.AVB_KEY }}
      CERT_OTA: ${{ secrets.CERT_OTA }}
      OTA_KEY: ${{ secrets.OTA_KEY }}
      PASSPHRASE_AVB: ${{ secrets.PASSPHRASE_AVB }}
      PASSPHRASE_OTA: ${{ secrets.PASSPHRASE_OTA }}

  transport_plan:
    if: github.event_name == 'workflow_dispatch' && inputs.source-artifact-id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Plan existing encrypted candidate transport
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source-artifact-id }}
          EXPECTED_SOURCE_ZIP_SHA256: ${{ inputs.expected-source-zip-sha256 }}
        run: python3 src/ci/transport_candidate_artifact.py plan

  transport_part:
    needs: transport_plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix: ${{ fromJSON(needs.transport_plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch exact encrypted ZIP part
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source-artifact-id }}
          EXPECTED_SOURCE_ZIP_SHA256: ${{ inputs.expected-source-zip-sha256 }}
          PART_INDEX: ${{ matrix.index }}
        run: |
          python3 src/ci/transport_candidate_artifact.py fetch-part \
            --part-index "${PART_INDEX}" --output-dir "${RUNNER_TEMP}/encrypted-part"
      - name: Upload encrypted ZIP part
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-device-candidate-part-${{ matrix.index }}
          path: ${{ runner.temp }}/encrypted-part
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
