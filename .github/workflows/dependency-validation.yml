name: Dependency compatibility validation
on:
  push:
    branches: [ops/dependency-validation-20261013]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.0'
      - name: Exercise ModOS Python and workflow boundaries
        run: |
          python --version
          python3 tests/boot_animation_test.py
          python3 tests/disable_system_updater_test.py
          python3 tests/encrypted_device_candidate_test.py
          python3 tests/transport_candidate_artifact_test.py
          bash tests/workflow_contract_test.sh
          bash tests/module_selection_test.sh
          bash tests/pdx235_release_quarantine_test.sh
      - uses: actions/checkout@v7
        with:
          repository: 0cwa/my-avbroot-setup
          ref: f263fa745872d5853f4535aa306a4eb1783c5601
          path: helper
      - name: Exercise exact locked helper under Python 3.15
        working-directory: helper
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --python 3.15
          uv run python --version
          uv run python -m unittest discover -s tests
          uv run python module-tool.py catalog --format json >/dev/null
          uv run python patch.py --help >/dev/null
      - name: Prepare small multipart artifact fixture
        run: |
          mkdir roundtrip
          printf 'candidate fixture\n' > roundtrip/candidate.zip
          printf '{"schema_version":1}\n' > roundtrip/receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compatibility-fixture
          path: roundtrip
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: compatibility-fixture
          path: restored
      - name: Verify default ZIP layout and byte preservation
        run: |
          python - <<'PY'
          from pathlib import Path
          original, restored = Path('roundtrip'), Path('restored')
          assert sorted(p.name for p in restored.iterdir()) == ['candidate.zip', 'receipt.json']
          for source in original.iterdir():
              assert source.read_bytes() == (restored / source.name).read_bytes()
          print('Default zipped artifact roundtrip preserves candidate layout and bytes')
          PY
