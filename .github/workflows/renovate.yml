# Why?
# https://www.jvt.me/posts/2024/04/12/use-renovate/

name: Renovate

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log levels based on severity. DEBUG, INFO, WARN, ERROR, FATAL
        required: false
        default: "info"
        type: string
  push:
    branches:
      - main

jobs:
  renovate:
    runs-on: ubuntu-latest
    # Renovate receives its narrowly scoped GitHub credential through the
    # secret below; the workflow token itself must remain read-only.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        # Upstream currently names v46.2.6, but this fork keeps its reviewed
        # immutable pin until the corresponding action artifact is verified.
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          configurationFile: .github/renovate.json5
          # https://docs.renovatebot.com/modules/platform/github/#running-using-a-fine-grained-token
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
