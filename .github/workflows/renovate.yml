# Why?
# https://www.jvt.me/posts/2024/04/12/use-renovate/

name: Renovate

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log levels based on severity. DEBUG, INFO, WARN, ERROR, FATAL
        required: false
        default: "info"
        type: string
  push:
    branches:
      - main

jobs:
  renovate:
    runs-on: ubuntu-latest
    # Renovate receives its narrowly scoped GitHub credential through the
    # secret below; the workflow token itself must remain read-only.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        # Match the upstream release while retaining an immutable action revision.
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          configurationFile: .github/renovate.json5
          # https://docs.renovatebot.com/modules/platform/github/#running-using-a-fine-grained-token
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
