name: Reusable ROM build

on:
  workflow_call:
    inputs:
      rom-family:
        required: false
        type: string
        default: grapheneos
      device-id:
        required: true
        type: string
      root:
        required: true
        type: boolean
      root-mode:
        required: false
        type: string
        default: ""
      afsr:
        required: false
        type: boolean
        default: true
      magisk-preinit-device:
        required: false
        type: string
        default: ""
      alterinstaller:
        required: false
        type: boolean
        default: true
      bcr:
        required: false
        type: boolean
        default: true
      custota:
        required: false
        type: boolean
        default: true
      msd:
        required: false
        type: boolean
        default: true
      oemunlockonboot:
        required: false
        type: boolean
        default: true
      microg:
        required: false
        type: boolean
        default: false
      disable-system-updater:
        required: false
        type: boolean
        default: false
      fdroid-privileged-extension:
        required: false
        type: boolean
        default: false
      shizuku:
        description: Install official Shizuku manager (supported ROM profile; separate rootless/Magisk builds)
        required: false
        type: boolean
        default: false
      update-channel:
        required: true
        type: string
      compatible-sepolicy-patching:
        required: true
        type: boolean
      allow-unauthorized-adb:
        required: true
        type: boolean
      boot-animation:
        required: false
        type: boolean
        default: true
      release-type:
        required: true
        type: string
      export-device-candidate:
        description: Export the explicit device candidate as OTA ZIPs; optionally encrypt for a recipient
        required: false
        type: boolean
        default: false
      device-candidate-recipient-base64:
        description: Optional base64 public PEM certificate; leave empty for normal OTA ZIP artifacts
        required: false
        type: string
        default: ""
      development-profile:
        description: Explicit source-build profile (none, care-map-pdx235, or care-map-pdx235-lineage24)
        required: false
        type: string
        default: none
      signing-mode:
        description: Build-only signer (disposable or repository); publication uses repository keys
        required: false
        type: string
        default: disposable
      publish:
        required: false
        type: boolean
        default: false
    secrets:
      AVB_KEY:
        required: false
      CERT_OTA:
        required: false
      OTA_KEY:
        required: false
      PASSPHRASE_AVB:
        required: false
      PASSPHRASE_OTA:
        required: false
      GH_TOKEN:
        required: false
      EMAIL:
        required: false

env:
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  DEVICE_NAME: ${{ inputs.device-id }}
  INTERACTIVE_MODE: false
  ROM_FAMILY: ${{ inputs.rom-family }}
  GRAPHENEOS_UPDATE_CHANNEL: ${{ inputs.update-channel }}
  OUTPUT_SCOPE: ${{ inputs.publish && inputs.release-type != 'build-only' && 'published' || 'local-unpublished' }}
  # Build-only runs must not receive the separate release-API credential.
  GH_TOKEN: ${{ inputs.publish && inputs.release-type != 'build-only' && secrets.GH_TOKEN || '' }}
  PIXENEOS_DEVELOPMENT_PROFILE: ${{ inputs.development-profile }}
  RELEASE_TYPE: ${{ inputs.release-type }}
  ROOT_MODE: ${{ inputs.root-mode }}
  ADDITIONALS_AFSR: ${{ inputs.afsr }}
  ADDITIONALS_ALTERINSTALLER: ${{ inputs.alterinstaller }}
  ADDITIONALS_BCR: ${{ inputs.bcr }}
  ADDITIONALS_CUSTOTA: ${{ inputs.custota }}
  ADDITIONALS_MSD: ${{ inputs.msd }}
  ADDITIONALS_OEMUNLOCKONBOOT: ${{ inputs.oemunlockonboot }}
  ADDITIONALS_MICROG: ${{ inputs.microg }}
  ADDITIONALS_DISABLE_SYSTEM_UPDATER: ${{ inputs.disable-system-updater }}
  ADDITIONALS_FDROID_PRIVILEGED_EXTENSION: ${{ inputs.fdroid-privileged-extension }}
  ADDITIONALS_SHIZUKU: ${{ inputs.shizuku }}
  ADDITIONALS_BOOT_ANIMATION: ${{ inputs.boot-animation }}

# Publishing inherits the caller job's permission ceiling. A reusable
# publishing job cannot request write even when skipped by a read-only caller.
jobs:
  build:
    if: inputs.publish && inputs.release-type != 'build-only'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps: &rom-build-steps
      - name: Validate build request
        shell: bash
        env:
          ADDITIONALS_DEBUG: ${{ inputs.allow-unauthorized-adb }}
          ADDITIONALS_MAS_COMPATIBLE_SEPOLICY: ${{ inputs.compatible-sepolicy-patching }}
          ADDITIONALS_ROOT: ${{ inputs.root }}
          MAGISK_PREINIT_REQUEST: ${{ inputs.magisk-preinit-device }}
          ROOT_MODE_INPUT: ${{ inputs.root-mode }}
          SIGNING_MODE: ${{ inputs.signing-mode }}
          EXPORT_DEVICE_CANDIDATE: ${{ inputs.export-device-candidate }}
          DEVELOPMENT_PROFILE: ${{ inputs.development-profile }}
          DEVICE_CANDIDATE_RECIPIENT_BASE64: ${{ inputs.device-candidate-recipient-base64 }}
          PUBLISH_REQUEST: ${{ inputs.publish }}
        run: |
          if [[ "${EXPORT_DEVICE_CANDIDATE}" == true ]]; then
            [[ ("${DEVELOPMENT_PROFILE}" == care-map-pdx235 ||
                 "${DEVELOPMENT_PROFILE}" == care-map-pdx235-lineage24) &&
              "${SIGNING_MODE}" == repository && "${RELEASE_TYPE}" == build-only &&
              "${PUBLISH_REQUEST}" == false ]] || {
              echo '::error::Candidate export requires an explicit nonpublishing repository-signed development candidate'
              exit 1
            }
          fi
          case "${SIGNING_MODE}" in
            disposable|repository) ;;
            *) echo "::error::signing-mode must be disposable or repository"; exit 1 ;;
          esac
          root_mode="${ROOT_MODE_INPUT}"
          if [[ -z "${root_mode}" ]]; then
            if [[ "${ADDITIONALS_ROOT}" == "true" ]]; then
              root_mode=magisk
            else
              root_mode=rootless
            fi
          fi
          case "${root_mode}" in
            rootless|magisk|both) ;;
            *) echo "::error::root-mode must be rootless, magisk, or both"; exit 1 ;;
          esac
          if [[ ("${root_mode}" == "magisk" || "${root_mode}" == "both") &&
            -z "${MAGISK_PREINIT_REQUEST}" ]]; then
            echo "::error::magisk-preinit-device is required for Magisk root modes"
            exit 1
          fi
          echo "ROOT_MODE=${root_mode}" >> "${GITHUB_ENV}"
          case "${RELEASE_TYPE}" in
            default|build-only|force-publish) ;;
            *) echo "::error::Unknown release type"; exit 1 ;;
          esac

      - name: Checkout shared implementation
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: ${{ inputs.publish && inputs.release-type != 'build-only' }}

      - name: Enforce profile output policy
        shell: bash
        env:
          EXPORT_DEVICE_CANDIDATE: ${{ inputs.export-device-candidate }}
          SIGNING_MODE: ${{ inputs.signing-mode }}
          PUBLISH: ${{ inputs.publish }}
          DEVICE_CANDIDATE_RECIPIENT_BASE64: ${{ inputs.device-candidate-recipient-base64 }}
          ADDITIONALS_DEBUG: ${{ inputs.allow-unauthorized-adb }}
          ADDITIONALS_MAS_COMPATIBLE_SEPOLICY: ${{ inputs.compatible-sepolicy-patching }}
          ADDITIONALS_ROOT: ${{ inputs.root }}
        run: |
          source src/declarations.sh
          source src/rom_profiles.sh
          resolve_rom_profile
          [[ "${PROJECT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
            echo '::error::PROJECT_NAME must be a repository-safe project name'
            exit 1
          }
          echo "PROJECT_NAME=${PROJECT_NAME}" >> "${GITHUB_ENV}"
          enforce_output_policy "${OUTPUT_SCOPE}"
          activate_development_profile
          if [[ "${EXPORT_DEVICE_CANDIDATE}" == true ]]; then
            python3 src/ci/encrypt_device_candidate.py --validate-request
          fi

      - name: Configure Android APK verification tools
        if: inputs.microg || inputs.fdroid-privileged-extension
        shell: bash
        run: bash src/ci/configure_android_apk_tools.sh

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15.0"

      - name: Setup signing environment
        if: (inputs.publish && inputs.release-type != 'build-only') || inputs.signing-mode == 'repository'
        shell: bash
        env:
          AVB_KEY: ${{ secrets.AVB_KEY }}
          CERT_OTA: ${{ secrets.CERT_OTA }}
          OTA_KEY: ${{ secrets.OTA_KEY }}
        run: |
          [[ -n "${AVB_KEY}" && -n "${CERT_OTA}" && -n "${OTA_KEY}" ]] || {
            echo "::error::Repository signing requires configured signing material"
            exit 1
          }
          delimiter="$(openssl rand -hex 16)"
          {
            echo "KEYS_AVB_BASE64<<${delimiter}"
            echo "${AVB_KEY}"
            echo "${delimiter}"
            echo "KEYS_CERT_OTA_BASE64<<${delimiter}"
            echo "${CERT_OTA}"
            echo "${delimiter}"
            echo "KEYS_OTA_BASE64<<${delimiter}"
            echo "${OTA_KEY}"
            echo "${delimiter}"
          } >> "${GITHUB_ENV}"

      - name: Generate disposable build-only signing keys
        if: (!inputs.publish || inputs.release-type == 'build-only') && inputs.signing-mode != 'repository'
        shell: bash
        run: bash src/ci/setup_test_signing.sh

      - name: Patch OTA
        shell: bash
        env:
          ADDITIONALS_DEBUG: ${{ inputs.allow-unauthorized-adb }}
          ADDITIONALS_MAS_COMPATIBLE_SEPOLICY: ${{ inputs.compatible-sepolicy-patching }}
          ADDITIONALS_ROOT: ${{ inputs.root }}
          CLEANUP: true
          EXPORT_DEVICE_CANDIDATE: ${{ inputs.export-device-candidate }}
          MAGISK_PREINIT: ${{ inputs.magisk-preinit-device }}
          PASSPHRASE_AVB: ${{ ((inputs.publish && inputs.release-type != 'build-only') || inputs.signing-mode == 'repository') && secrets.PASSPHRASE_AVB || '' }}
          PASSPHRASE_OTA: ${{ ((inputs.publish && inputs.release-type != 'build-only') || inputs.signing-mode == 'repository') && secrets.PASSPHRASE_OTA || '' }}
        run: |
          source src/main.sh
          if [[ "${EXPORT_DEVICE_CANDIDATE}" == true ]]; then
            public_pkmd="${WORKDIR}/device-candidate-avb_pkmd.bin"
            run_executable_tool avbroot key encode-avb \
              -k "${KEYS[AVB]}" --pass-env-var PASSPHRASE_AVB -o "${public_pkmd}"
            echo "DEVICE_CANDIDATE_PKMD=${public_pkmd}" >> "${GITHUB_ENV}"
            # The signing inputs were decoded into this job's private workdir.
            # Transport stages need only the verified outputs and public key.
            for private_key in "${KEYS[AVB]}" "${KEYS[OTA]}"; do
              case "${private_key}" in
                "${WORKDIR}/.keys/"*) rm -f -- "${private_key}" ;;
                *) echo '::error::Unexpected candidate signing-key storage'; exit 1 ;;
              esac
            done
            for binding in KEYS_AVB_BASE64 KEYS_OTA_BASE64 KEYS_CERT_OTA_BASE64; do
              printf '%s=\n' "${binding}" >> "${GITHUB_ENV}"
            done
          fi
          {
            echo "GRAPHENEOS_OTA_TARGET=${GRAPHENEOS[OTA_TARGET]}"
            echo "GRAPHENEOS_VERSION=${VERSION[GRAPHENEOS]}"
            echo "MAGISK_REPOSITORY=${MAGISK[REPOSITORY]}"
            echo "MAGISK_VERSION=${VERSION[MAGISK]}"
            echo "MODULE_SELECTION_FINGERPRINT=${MODULE_SELECTION_FINGERPRINT}"
            echo "MODULE_SELECTION_FINGERPRINT_ROOTLESS=${MODULE_SELECTION_FINGERPRINT_ROOTLESS}"
            echo "MODULE_SELECTION_FINGERPRINT_MAGISK=${MODULE_SELECTION_FINGERPRINT_MAGISK}"
            echo "OUTPUTS_PATCHED_OTA=${OUTPUTS[PATCHED_OTA]}"
            echo "OUTPUTS_PATCHED_OTA_ROOTLESS=${OUTPUTS[PATCHED_OTA_ROOTLESS]}"
            echo "OUTPUTS_PATCHED_OTA_MAGISK=${OUTPUTS[PATCHED_OTA_MAGISK]}"
            echo "OTA_METADATA_ROOTLESS=${OUTPUTS[OTA_METADATA_ROOTLESS]}"
            echo "OTA_METADATA_MAGISK=${OUTPUTS[OTA_METADATA_MAGISK]}"
            echo "ROOT_MODE_RESOLVED=${RESOLVED_ROOT_MODE}"
            echo "ROM_PROFILE_PROVIDER=${ROM_PROFILE[PROVIDER]}"
            echo "WORKDIR=${WORKDIR}"
            echo "SOURCE_OTA_SHA256=${ROM_OTA_SHA256:-}"
            echo "SOURCE_OTA_TARGET=${GRAPHENEOS[OTA_TARGET]}"
            echo "BUILD_COMMIT=$(git rev-parse --verify HEAD)"
          } >> "${GITHUB_ENV}"
          case "${RESOLVED_ROOT_MODE}" in
            magisk) echo 'ROM_FLAVOR=magisk' >> "${GITHUB_ENV}" ;;
            rootless) echo 'ROM_FLAVOR=rootless' >> "${GITHUB_ENV}" ;;
            both) echo 'ROM_FLAVOR=both' >> "${GITHUB_ENV}" ;;
          esac

      - name: Record build metadata
        shell: bash
        run: |
          record_selection_metadata() {
            local artifact_name="${1}"
            local fingerprint="${2}"
            local env_name="${3}"
            local selection_metadata="${artifact_name}.selection.json"
            python3 - \
              "${selection_metadata}" \
              "${artifact_name}" \
              "${ROM_FAMILY}" \
              "${DEVICE_NAME}" \
              "${GRAPHENEOS_VERSION}" \
              "${fingerprint}" \
              "${OUTPUT_SCOPE}" \
              "${SOURCE_OTA_SHA256:-}" \
              "${SOURCE_OTA_TARGET:-}" \
              "${BUILD_COMMIT:-}" <<'PY'
          import json
          import pathlib
          import sys

          (path, artifact_name, rom_family, device, version, fingerprint,
           output_scope, source_sha256, source_target, build_commit) = sys.argv[1:]
          data = {
              "artifact_name": artifact_name,
              "device": device,
              "grapheneos_version": version,
              "module_selection_fingerprint": fingerprint,
              "output_scope": output_scope,
              "rom_family": rom_family,
              "schema_version": 2,
              "source_ota_sha256": source_sha256,
              "source_ota_target": source_target,
              "modos_commit": build_commit,
          }
          pathlib.Path(path).write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            echo "${env_name}=${selection_metadata}" >> "${GITHUB_ENV}"
          }

          if [[ "${ROOT_MODE_RESOLVED}" == both ]]; then
            record_selection_metadata \
              "${OUTPUTS_PATCHED_OTA_ROOTLESS}" \
              "${MODULE_SELECTION_FINGERPRINT_ROOTLESS}" \
              SELECTION_METADATA_ROOTLESS
            record_selection_metadata \
              "${OUTPUTS_PATCHED_OTA_MAGISK}" \
              "${MODULE_SELECTION_FINGERPRINT_MAGISK}" \
              SELECTION_METADATA_MAGISK
          else
            record_selection_metadata \
              "${OUTPUTS_PATCHED_OTA}" \
              "${MODULE_SELECTION_FINGERPRINT}" \
              SELECTION_METADATA
          fi

          {
            echo "ROM family: ${ROM_FAMILY}"
            echo "Device: ${DEVICE_NAME}"
            echo "Root mode: ${ROOT_MODE_RESOLVED}"
            if [[ "${ROOT_MODE_RESOLVED}" == both ]]; then
              echo "Rootless selection fingerprint: ${MODULE_SELECTION_FINGERPRINT_ROOTLESS}"
              echo "Magisk selection fingerprint: ${MODULE_SELECTION_FINGERPRINT_MAGISK}"
            else
              echo "Selection fingerprint: ${MODULE_SELECTION_FINGERPRINT}"
            fi
            echo "Output scope: ${OUTPUT_SCOPE}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Stage device candidate
        if: inputs.export-device-candidate
        id: candidate_export
        shell: bash
        env:
          SIGNING_MODE: ${{ inputs.signing-mode }}
          PUBLISH: ${{ inputs.publish }}
          DEVICE_CANDIDATE_RECIPIENT_BASE64: ${{ inputs.device-candidate-recipient-base64 }}
        run: |
          stage_parent="$(mktemp -d "${RUNNER_TEMP}/device-candidate-export.XXXXXX")"
          stage="${stage_parent}/payload"
          candidate_args=(--workspace "${GITHUB_WORKSPACE}" --stage "${stage}" \
            --public-key "${DEVICE_CANDIDATE_PKMD}")
          if [[ "${ROOT_MODE_RESOLVED}" == both ]]; then
            candidate_args+=(--ota "${OUTPUTS_PATCHED_OTA_ROOTLESS}" --ota "${OUTPUTS_PATCHED_OTA_MAGISK}")
          else
            candidate_args+=(--ota "${OUTPUTS_PATCHED_OTA}")
          fi
          if [[ "${ADDITIONALS_MICROG}" == true ]]; then
            candidate_args+=(--microg)
          fi
          python3 src/ci/encrypt_device_candidate.py "${candidate_args[@]}"
          echo "stage=${stage}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${DEVICE_CANDIDATE_RECIPIENT_BASE64}" ]]; then
            echo 'artifact-name=encrypted-device-candidate' >> "${GITHUB_OUTPUT}"
          else
            echo 'artifact-name=device-candidate' >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload device candidate
        if: inputs.export-device-candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.candidate_export.outputs.artifact-name }}
          path: ${{ steps.candidate_export.outputs.stage }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Re-enforce publication policy
        if: inputs.publish && inputs.release-type != 'build-only'
        shell: bash
        env:
          ADDITIONALS_DEBUG: ${{ inputs.allow-unauthorized-adb }}
          ADDITIONALS_MAS_COMPATIBLE_SEPOLICY: ${{ inputs.compatible-sepolicy-patching }}
          ADDITIONALS_ROOT: ${{ inputs.root }}
        run: |
          source src/declarations.sh
          source src/rom_profiles.sh
          resolve_rom_profile
          enforce_publication_evidence "${OUTPUT_SCOPE}"
          [[ "${MODULE_SELECTION_FINGERPRINT}" =~ ^[0-9a-f]{64}$ ]]

      - name: Generate changelog
        if: inputs.publish && inputs.release-type != 'build-only'
        shell: bash
        run: |
          {
            echo "ROM family: ${ROM_FAMILY}"
            echo "Device: ${DEVICE_NAME}"
            echo "Root mode: ${ROOT_MODE_RESOLVED}"
            if [[ "${ROOT_MODE_RESOLVED}" == both ]]; then
              echo "Rootless module-selection fingerprint: ${MODULE_SELECTION_FINGERPRINT_ROOTLESS}"
              echo "Magisk module-selection fingerprint: ${MODULE_SELECTION_FINGERPRINT_MAGISK}"
            else
              echo "Module-selection fingerprint: ${MODULE_SELECTION_FINGERPRINT}"
            fi
            if [[ "${ROOT_MODE_RESOLVED}" == magisk || "${ROOT_MODE_RESOLVED}" == both ]]; then
              echo
              echo "Magisk boot patch: statically verified during the build."
              echo "Runtime root bootstrap: install/open the matching ${MAGISK_REPOSITORY} ${MAGISK_VERSION} manager, complete Additional setup / Environment fix when prompted, then reboot."
              echo "Runtime verification: adb shell su -c id"
            fi
          } > "${GITHUB_WORKSPACE}-CHANGELOG.txt"

      - name: Publish GitHub release
        if: inputs.publish && inputs.release-type != 'build-only' && env.ROOT_MODE_RESOLVED != 'both'
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ github.workspace }}-CHANGELOG.txt
          files: |
            ${{ env.OUTPUTS_PATCHED_OTA }}
            ${{ env.OUTPUTS_PATCHED_OTA }}.csig
            ${{ env.SELECTION_METADATA }}
          name: ${{ env.PROJECT_NAME }} ${{ env.GRAPHENEOS_VERSION }}
          tag_name: ${{ env.GRAPHENEOS_VERSION }}

      - name: Publish paired GitHub release assets
        if: inputs.publish && inputs.release-type != 'build-only' && env.ROOT_MODE_RESOLVED == 'both'
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ github.workspace }}-CHANGELOG.txt
          files: |
            ${{ env.OUTPUTS_PATCHED_OTA_ROOTLESS }}
            ${{ env.OUTPUTS_PATCHED_OTA_ROOTLESS }}.csig
            ${{ env.SELECTION_METADATA_ROOTLESS }}
            ${{ env.OUTPUTS_PATCHED_OTA_MAGISK }}
            ${{ env.OUTPUTS_PATCHED_OTA_MAGISK }}.csig
            ${{ env.SELECTION_METADATA_MAGISK }}
          name: ${{ env.PROJECT_NAME }} ${{ env.GRAPHENEOS_VERSION }}
          tag_name: ${{ env.GRAPHENEOS_VERSION }}

      - name: Remove superseded release assets
        if: inputs.publish && inputs.release-type != 'build-only' && env.ROOT_MODE_RESOLVED != 'both'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OTA_ARTIFACT_PATH: ${{ env.OUTPUTS_PATCHED_OTA }}
          SELECTION_METADATA_PATH: ${{ env.SELECTION_METADATA }}
        run: bash src/ci/remove_superseded_assets.sh

      - name: Remove superseded paired release assets
        if: inputs.publish && inputs.release-type != 'build-only' && env.ROOT_MODE_RESOLVED == 'both'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODULE_SELECTION_FINGERPRINT="${MODULE_SELECTION_FINGERPRINT_ROOTLESS}" \
          OTA_ARTIFACT_PATH="${OUTPUTS_PATCHED_OTA_ROOTLESS}" \
          SELECTION_METADATA_PATH="${SELECTION_METADATA_ROOTLESS}" \
            bash src/ci/remove_superseded_assets.sh
          MODULE_SELECTION_FINGERPRINT="${MODULE_SELECTION_FINGERPRINT_MAGISK}" \
          OTA_ARTIFACT_PATH="${OUTPUTS_PATCHED_OTA_MAGISK}" \
          SELECTION_METADATA_PATH="${SELECTION_METADATA_MAGISK}" \
            bash src/ci/remove_superseded_assets.sh

      - name: Publish OTA metadata
        if: inputs.publish && inputs.release-type != 'build-only' && env.ROOT_MODE_RESOLVED != 'both'
        shell: bash
        env:
          GIT_COMMIT_EMAIL: ${{ secrets.EMAIL }}
          GIT_COMMIT_NAME: ${{ github.repository_owner }}
          OTA_ARTIFACT_PATH: ${{ env.OUTPUTS_PATCHED_OTA }}
          OTA_METADATA_PATH: ${{ env.DEVICE_NAME }}.json
          ROM_FLAVOR: ${{ env.ROM_FLAVOR }}
          ROM_PROFILE_PROVIDER: ${{ env.ROM_PROFILE_PROVIDER }}
          SELECTION_METADATA_PATH: ${{ env.SELECTION_METADATA }}
        run: |
          bash src/ci/publish_ota.sh

      - name: Publish paired OTA metadata
        if: inputs.publish && inputs.release-type != 'build-only' && env.ROOT_MODE_RESOLVED == 'both'
        shell: bash
        env:
          GIT_COMMIT_EMAIL: ${{ secrets.EMAIL }}
          GIT_COMMIT_NAME: ${{ github.repository_owner }}
          ROM_PROFILE_PROVIDER: ${{ env.ROM_PROFILE_PROVIDER }}
          ROOTLESS_OTA_ARTIFACT_PATH: ${{ env.OUTPUTS_PATCHED_OTA_ROOTLESS }}
          ROOTLESS_SELECTION_METADATA_PATH: ${{ env.SELECTION_METADATA_ROOTLESS }}
          ROOTLESS_OTA_METADATA_PATH: ${{ env.OTA_METADATA_ROOTLESS }}
          ROOTLESS_MODULE_SELECTION_FINGERPRINT: ${{ env.MODULE_SELECTION_FINGERPRINT_ROOTLESS }}
          MAGISK_OTA_ARTIFACT_PATH: ${{ env.OUTPUTS_PATCHED_OTA_MAGISK }}
          MAGISK_SELECTION_METADATA_PATH: ${{ env.SELECTION_METADATA_MAGISK }}
          MAGISK_OTA_METADATA_PATH: ${{ env.OTA_METADATA_MAGISK }}
          MAGISK_MODULE_SELECTION_FINGERPRINT: ${{ env.MODULE_SELECTION_FINGERPRINT_MAGISK }}
        run: |
          bash src/ci/publish_ota_pair.sh

  build_only:
    if: "!inputs.publish || inputs.release-type == 'build-only'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The common pipeline defaults to disposable keys. An explicit device
    # candidate may retain repository signing identity; every publisher skips.
    steps: *rom-build-steps
