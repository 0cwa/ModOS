name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fallback secrets scanner
        env:
          PIXENEOS_SKIP_GITLEAKS: "true"
        run: src/scan_secrets.sh --all

      - name: Configure Android APK verification tools
        shell: bash
        run: bash src/ci/configure_android_apk_tools.sh

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.sh src/ci/*.sh tests/*.sh; do
            bash -n "${file}"
          done

      - name: ShellCheck when available
        shell: bash
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x -S warning src/main.sh src/setup_hooks.sh
          else
            echo "::notice::ShellCheck is not installed on this runner; skipping ShellCheck."
          fi

      - name: Test avbroot compatibility helper
        shell: bash
        run: bash tests/avbroot_setup_compat_test.sh --strict

      - name: Check microG release against immutable helper lock
        run: python3 src/ci/check_microg_helper_lock.py

      - name: Test Companion publication continuity
        run: python3 tests/companion_continuity_test.py

      - name: Verify pinned exfatprogs package with image adapter
        run: python3 src/ci/check_exfatprogs_artifact.py

      - name: Setup Rust for compiled SELinux policy patcher
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust 1.99.1
        with:
          toolchain: 1.99.1

      - name: Install libclang for compiled SELinux policy patcher
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libclang-dev

      - name: Test compiled SELinux policy patcher
        run: cargo test --locked --manifest-path src/exfatprogs_sepolicy/Cargo.toml

      - name: Build policy patcher through production toolchain guard
        shell: bash
        run: |
          set -euo pipefail
          source src/util_functions.sh
          build_exfatprogs_policy_patcher "${GITHUB_WORKSPACE}"

      - name: Verify exfatprogs lock with pinned module-tool
        shell: bash
        run: |
          set -euo pipefail
          source src/declarations.sh
          helper="${RUNNER_TEMP}/pinned-module-tool"
          python3 -m venv "${RUNNER_TEMP}/module-tool-venv"
          "${RUNNER_TEMP}/module-tool-venv/bin/python" -m pip install --disable-pip-version-check 'pydantic>=2.12.0' 'tomlkit>=0.13.2'
          git init -q "${helper}"
          git -C "${helper}" remote add origin "${PIXENEOS_AVBROOT_SETUP_SOURCE:-https://github.com/0cwa/my-avbroot-setup}"
          git -C "${helper}" fetch --quiet --depth=1 origin "${VERSION[AVBROOT_SETUP]}"
          git -C "${helper}" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "${helper}" rev-parse HEAD)" = "${VERSION[AVBROOT_SETUP]}"
          "${RUNNER_TEMP}/module-tool-venv/bin/python" "${helper}/module-tool.py" lock verify --lock locks/exfatprogs-termux-v1.4.3.json

      - name: Verify deterministic exfatprogs corresponding-source bundle
        run: python3 src/ci/build_exfatprogs_source_bundle.py --output-dir "${RUNNER_TEMP}/exfatprogs-source-ci" --check-deterministic

      - name: Test exfatprogs published-scope source gate
        run: python3 tests/exfat_source_scope_test.py

      - name: Test exfatprogs image metadata diagnostics
        run: python3 tests/exfat_adapter_metadata_test.py

      - name: Test unmodified original vold CI-only baseline
        run: python3 tests/vold_baseline_ci_test.py

      - name: Test actual Repo manifest selection and bounded build inputs
        run: python3 tests/vold_original_build_test.py

      - name: Test bounded original Vold source dependency resolver
        run: python3 tests/vold_source_closure_test.py

      - name: Test immutable Sony vendor acquisition and regeneration
        run: python3 tests/vold_vendor_makefiles_test.py

      - name: Test original vold probe ordering and bounded expansion
        run: python3 tests/vold_probe_orchestration_test.py

      - name: Test persistent local original vold build commands
        run: python3 tests/vold_local_test.py

      - name: Test authenticated local build tool setup
        run: python3 tests/vold_local_tools_test.py

      - name: Generate the provisional original vold source plan
        run: python3 src/ci/vold_source_closure.py plan --output "${RUNNER_TEMP}/vold-source-plan.json"

      - name: Retain the provisional original vold source plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vold-source-provisional-plan
          path: ${{ runner.temp }}/vold-source-plan.json
          if-no-files-found: error
          retention-days: 14

      - name: Test pdx235 Custota metadata preparation
        run: bash tests/pdx235_custota_metadata_test.sh

      - name: Run deterministic tests
        shell: bash
        env:
          REQUIRE_EXFAT_SOURCE_BUNDLE: "true"
        run: |
          set -euo pipefail
          bash tests/declarations_config_test.sh
          bash tests/typed_config_resolver_test.sh
          bash tests/helper_preflight_test.sh
          bash tests/upstream_integration_test.sh
          python3 tests/build_diagnostics_test.py
          bash tests/scheduled_build_definitions_test.sh
          bash tests/root_mode_both_test.sh
          bash tests/magisk_output_verification_test.sh
          bash tests/release_url_config_test.sh
          bash tests/release_existing_build_test.sh
          bash tests/release_existing_pair_test.sh
          bash tests/pdx235_existing_build_preflight_test.sh
          python3 tests/lineage_workflow_routing_test.py
          bash tests/provider_acquisition_test.sh
          bash tests/executable_tool_lock_test.sh
          bash tests/executable_tool_bootstrap_test.sh
          bash tests/executable_tool_routing_test.sh
          bash tests/workflow_contract_test.sh
          python3 tests/fsck_sysfs_sepolicy_registration_test.py
          bash tests/rom_contract_test.sh
          bash tests/module_selection_test.sh
          bash tests/source_care_map_policy_test.sh
          bash tests/pdx235_source_publisher_test.sh
          bash tests/pdx235_repaired_helper_test.sh
          bash tests/pdx235_release_quarantine_test.sh
          bash tests/exfat_source_asset_test.sh
          bash tests/custota_device_alias_test.sh
          python3 tests/pdx235_modular_health_test.py
          bash tests/boot_animation_config_test.sh
          bash tests/boot_animation_registration_test.sh
          python3 tests/boot_animation_test.py
          python3 tests/shizuku_adapter_test.py
          python3 tests/shizuku_post_boot_check_test.py
          python3 tests/disable_system_updater_test.py
          bash tests/disable_system_updater_registration_test.sh
          python3 tests/microg_spoof_patch_test.py
          bash tests/microg_spoof_patch_registration_test.sh
          bash tests/microg_companion_build_test.sh
          python3 tests/lineage_vold_test.py
          bash tests/lineage_vold_registration_test.sh
          bash tests/secrets_scan_test.sh
          bash tests/verifier_test.sh

      - name: Check upstream download endpoints
        shell: bash
        run: bash src/ci/smoke_test.sh

  # No repository signing secrets, release credentials or write permissions.
  # Same-repository integration branches opt into real, nonpublishing OTA builds.
  # This catches runner/tool upgrades that the deterministic tests cannot cover.
  lineage24_qualification:
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'integration/') ||
       github.head_ref == 'feature/lineage24-care-map-qualification-20261015' ||
       github.head_ref == 'feat/vold-exfat-timeout-binary-patch')
    permissions:
      contents: read
    uses: ./.github/workflows/build-rom.yml
    with:
      rom-family: lineageos
      device-id: pdx235
      root: false
      root-mode: both
      magisk-preinit-device: sda47
      update-channel: nightly
      compatible-sepolicy-patching: true
      allow-unauthorized-adb: false
      microg: true
      # The vold PR exercises both patches in the same verified OTA pair.
      microg-spoof-patch: ${{ github.head_ref == 'feat/vold-exfat-timeout-binary-patch' }}
      lineage-vold-exfat-timeout: ${{ github.head_ref == 'feat/vold-exfat-timeout-binary-patch' }}
      bcr: true
      # MSD v2.6's physical-device HAL mapping is not yet qualified on pdx235.
      msd: false
      exfatprogs-fsck: true
      fsck-sysfs-sepolicy: true
      disable-system-updater: true
      boot-animation: true
      # Exercise the ordinary provider/build path, not the opt-in fixture profile.
      development-profile: none
      signing-mode: disposable
      release-type: build-only
      publish: false

  grapheneos_qualification:
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'integration/')
    permissions:
      contents: read
    uses: ./.github/workflows/build-rom.yml
    with:
      rom-family: grapheneos
      device-id: shiba
      root: false
      root-mode: both
      magisk-preinit-device: sda10
      update-channel: stable
      compatible-sepolicy-patching: false
      allow-unauthorized-adb: false
      microg: false
      bcr: false
      exfatprogs-fsck: false
      fsck-sysfs-sepolicy: false
      disable-system-updater: true
      boot-animation: true
      development-profile: none
      signing-mode: disposable
      release-type: build-only
      publish: false

  # This PR branch compiles the Companion using a fresh runner-only test key.
  # Only logs and verification receipts leave the job; no APK or key is retained.
  microg_companion_qualification:
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/microg-companion-signer-patch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the proposed Companion builder
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install reviewed Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0'

      - name: Build and verify the Companion with a disposable signer
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/microg-companion-gradle
          MICROG_GRADLE_ARGS: --max-workers=2
        run: |
          set -euo pipefail
          umask 077
          evidence="${RUNNER_TEMP}/microg-companion-evidence"
          mkdir -m 700 -- "${evidence}"
          private_dir="$(mktemp -d "${RUNNER_TEMP}/microg-companion-key.XXXXXXXX")"
          output="$(mktemp -d "${RUNNER_TEMP}/microg-companion-output.XXXXXXXX")"
          trap 'rm -rf -- "${private_dir}" "${output}"' EXIT
          python3 - "${private_dir}/password" <<'PY'
          import secrets
          import sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(secrets.token_urlsafe(48) + "\n")
          PY
          keytool -genkeypair -keystore "${private_dir}/test.p12" -storetype PKCS12 \
            -alias companion-ci-test -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=ModOS disposable compilation test' \
            -storepass:file "${private_dir}/password" -keypass:file "${private_dir}/password" \
            -noprompt
          keytool -exportcert -keystore "${private_dir}/test.p12" -alias companion-ci-test \
            -storepass:file "${private_dir}/password" -file "${private_dir}/certificate.der"
          {
            printf 'modos_commit=%s\n' "$(git rev-parse HEAD)"
            java -version
            cat "${ANDROID_HOME}/build-tools/35.0.0/source.properties"
            cat "${ANDROID_HOME}/platforms/android-35/source.properties"
          } >"${evidence}/toolchain.txt" 2>&1
          tools/build-microg-companion.sh \
            --keystore "${private_dir}/test.p12" --alias companion-ci-test \
            --pass-file "${private_dir}/password" --output "${output}" \
            2>&1 | tee "${evidence}/build.log"
          build_tools="${ANDROID_HOME}/build-tools/35.0.0"
          "${build_tools}/zipalign" -c -p 4 "${output}/com.android.vending.apk"
          "${build_tools}/aapt" dump badging "${output}/com.android.vending.apk" \
            >"${evidence}/apk-badging.txt"
          "${build_tools}/apksigner" verify --print-certs "${output}/com.android.vending.apk" \
            >"${evidence}/signer-verified.txt"
          cp -- "${output}/build-record.txt" "${evidence}/build-record.txt"
          cp -- "${output}/signer.txt" "${evidence}/signer.txt"
          python3 - "${output}" "${private_dir}/certificate.der" "${evidence}" <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          output, certificate, evidence = map(Path, sys.argv[1:])
          def require(ok, message):
              if not ok:
                  raise SystemExit(message)
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          receipt_lines = (evidence / "build-record.txt").read_text().splitlines()
          def field(name):
              values = [line.split("=", 1)[1] for line in receipt_lines if line.startswith(name + "=")]
              require(len(values) == 1, "Missing or repeated build receipt field: " + name)
              return values[0]

          require(field("release") == "v0.3.17.252432", "Unexpected source release")
          require(field("source_commit") == "32bc8954ff872d0e1a05ddfae81561b6dbecef69",
                  "Unexpected upstream source commit")
          commit, tree = field("gmscore_commit"), field("gmscore_tree")
          require(re.fullmatch(r"[0-9a-f]{40}", commit) and re.fullmatch(r"[0-9a-f]{40}", tree),
                  "Invalid patched source identity")
          patch_lines = [line for line in receipt_lines if line.startswith("patch=")]
          patches = sorted(Path("patches/microg").glob("*.patch"))
          expected_patches = [f"patch={path.name} sha256={digest(path)}" for path in patches]
          require(patches and patch_lines == expected_patches, "Build receipt does not match reviewed patches")

          badging = (evidence / "apk-badging.txt").read_text()
          package_lines = [line for line in badging.splitlines() if line.startswith("package: ")]
          require(len(package_lines) == 1, "Expected exactly one package declaration")
          package = dict(re.findall(r"(\w+)='([^']*)'", package_lines[0]))
          expected_name = f"0.3.17.40226-{len(patches)} ({commit[:7]})"
          require(package.get("name") == "com.android.vending", "Unexpected APK package")
          require(package.get("versionCode") == "84022635", "Unexpected Companion versionCode")
          require(package.get("versionName") == expected_name, "Unexpected Companion versionName")
          require(not re.search(r"^application-debuggable(?:$|:|\s)", badging, re.M),
                  "Debuggable APK refused")
          apk_digest = digest(output / "com.android.vending.apk")
          require(apk_digest == field("apk_sha256"), "APK digest differs from build receipt")

          signer_text = (evidence / "signer-verified.txt").read_text()
          signers = re.findall(r"^Signer #(\d+) certificate SHA-256 digest: ([0-9a-fA-F]{64})$",
                               signer_text, re.M)
          expected_signer = digest(certificate)
          require(signers == [("1", expected_signer)], "APK signer differs from the disposable test key")
          require(signer_text == (evidence / "signer.txt").read_text(),
                  "Independent signature verification differs from builder receipt")
          report = {
              "status": "disposable-companion-build-verified",
              "production_eligible": False,
              "apk_retained": False,
              "device_acceptance": "not-tested",
              "workflow_run": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"]
                              + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "modos_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_commit": field("source_commit"),
              "patched_commit": commit,
              "patched_tree": tree,
              "patches": patch_lines,
              "package": package["name"],
              "version_code": int(package["versionCode"]),
              "version_name": package["versionName"],
              "apk_sha256": apk_digest,
              "signer_sha256": expected_signer,
              "signer_purpose": "fresh disposable compilation test only",
          }
          (evidence / "verification.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Retain Companion build evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microg-companion-compilation-evidence
          path: |
            ${{ runner.temp }}/microg-companion-evidence/build.log
            ${{ runner.temp }}/microg-companion-evidence/build-record.txt
            ${{ runner.temp }}/microg-companion-evidence/signer.txt
            ${{ runner.temp }}/microg-companion-evidence/signer-verified.txt
            ${{ runner.temp }}/microg-companion-evidence/apk-badging.txt
            ${{ runner.temp }}/microg-companion-evidence/toolchain.txt
            ${{ runner.temp }}/microg-companion-evidence/verification.json
          if-no-files-found: warn
          retention-days: 14
