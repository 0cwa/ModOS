name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fallback secrets scanner
        env:
          PIXENEOS_SKIP_GITLEAKS: "true"
        run: src/scan_secrets.sh --all

      - name: Configure Android APK verification tools
        shell: bash
        run: bash src/ci/configure_android_apk_tools.sh

      - name: Qualify signed avbroot 3.35 archive for executable lock review
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "${scratch}"' EXIT
          asset='avbroot-3.35.0-x86_64-unknown-linux-gnu.zip'
          url="https://github.com/chenxiaolong/avbroot/releases/download/v3.35.0/${asset}"
          curl --proto '=https' --tlsv1.2 --retry 3 -fLsS -o "${scratch}/${asset}" "${url}"
          curl --proto '=https' --tlsv1.2 --retry 3 -fLsS -o "${scratch}/${asset}.sig" "${url}.sig"
          echo 'bbc7f8b4df8d9e6d2162bf354ac9f06643b2f64247a6f345d71e963f645f58c5  '"${scratch}/${asset}" | sha256sum -c -
          echo '7ab8b19e7c47bbaf7f846df5c601b3a0888d605f5a3176144b7bedf64600176b  '"${scratch}/${asset}.sig" | sha256sum -c -
          ssh-keygen -Y verify -f trust/chenxiaolong.allowed_signers -I chenxiaolong -n file -s "${scratch}/${asset}.sig" < "${scratch}/${asset}"
          python3 - "${scratch}/${asset}" <<'PY'
          import hashlib, json, pathlib, stat, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              if [i.filename for i in infos] != ['LICENSE', 'README.md', 'avbroot']:
                  raise SystemExit('Unreviewed avbroot archive member list')
              layout = []
              for info in infos:
                  if info.is_dir() or info.flag_bits & 1:
                      raise SystemExit('Unexpected directory/encrypted member')
                  mode = stat.S_IMODE(info.external_attr >> 16)
                  if not stat.S_ISREG(info.external_attr >> 16):
                      raise SystemExit('Unexpected archive member type')
                  if mode != (0o755 if info.filename == 'avbroot' else 0o644):
                      raise SystemExit('Unexpected archive member mode')
                  data = z.read(info)
                  layout.append(dict(path=info.filename,type='file',mode=f'{mode:04o}',size=len(data),sha256=hashlib.sha256(data).hexdigest()))
              print('AVBROOT_335_VERIFIED_LAYOUT='+json.dumps(layout,sort_keys=True))
          PY

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.sh src/ci/*.sh tests/*.sh; do
            bash -n "${file}"
          done

      - name: ShellCheck when available
        shell: bash
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x -S warning src/main.sh src/setup_hooks.sh
          else
            echo "::notice::ShellCheck is not installed on this runner; skipping ShellCheck."
          fi

      - name: Test avbroot compatibility helper
        shell: bash
        run: bash tests/avbroot_setup_compat_test.sh --strict

      - name: Check microG release against immutable helper lock
        run: python3 src/ci/check_microg_helper_lock.py

      - name: Run deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/declarations_config_test.sh
          bash tests/typed_config_resolver_test.sh
          bash tests/helper_preflight_test.sh
          bash tests/upstream_integration_test.sh
          bash tests/scheduled_build_definitions_test.sh
          bash tests/root_mode_both_test.sh
          bash tests/magisk_output_verification_test.sh
          bash tests/release_url_config_test.sh
          bash tests/release_existing_build_test.sh
          bash tests/release_existing_pair_test.sh
          bash tests/provider_acquisition_test.sh
          bash tests/executable_tool_lock_test.sh
          bash tests/executable_tool_bootstrap_test.sh
          bash tests/executable_tool_routing_test.sh
          bash tests/workflow_contract_test.sh
          bash tests/rom_contract_test.sh
          bash tests/module_selection_test.sh
          bash tests/source_care_map_policy_test.sh
          bash tests/pdx235_source_publisher_test.sh
          bash tests/pdx235_release_quarantine_test.sh
          bash tests/boot_animation_config_test.sh
          bash tests/boot_animation_registration_test.sh
          python3 tests/boot_animation_test.py
          python3 tests/disable_system_updater_test.py
          bash tests/disable_system_updater_registration_test.sh
          bash tests/secrets_scan_test.sh
          bash tests/verifier_test.sh

      - name: Check upstream download endpoints
        shell: bash
        run: bash src/ci/smoke_test.sh
