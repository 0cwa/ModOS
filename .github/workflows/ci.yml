name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fallback secrets scanner
        env:
          PIXENEOS_SKIP_GITLEAKS: "true"
        run: src/scan_secrets.sh --all

      - name: Configure Android APK verification tools
        shell: bash
        run: bash src/ci/configure_android_apk_tools.sh

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.sh src/ci/*.sh tests/*.sh; do
            bash -n "${file}"
          done

      - name: ShellCheck when available
        shell: bash
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x -S warning src/main.sh src/setup_hooks.sh
          else
            echo "::notice::ShellCheck is not installed on this runner; skipping ShellCheck."
          fi

      - name: Test avbroot compatibility helper
        shell: bash
        run: bash tests/avbroot_setup_compat_test.sh --strict

      - name: Check microG release against immutable helper lock
        run: python3 src/ci/check_microg_helper_lock.py

      - name: Verify pinned exfatprogs package with image adapter
        run: python3 src/ci/check_exfatprogs_artifact.py

      - name: Setup Rust for compiled SELinux policy patcher
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust 1.97.1
        with:
          toolchain: 1.97.1

      - name: Install libclang for compiled SELinux policy patcher
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libclang-dev

      - name: Test compiled SELinux policy patcher
        run: cargo test --locked --manifest-path src/exfatprogs_sepolicy/Cargo.toml

      - name: Verify exfatprogs lock with pinned module-tool
        shell: bash
        run: |
          set -euo pipefail
          source src/declarations.sh
          helper="${RUNNER_TEMP}/pinned-module-tool"
          python3 -m venv "${RUNNER_TEMP}/module-tool-venv"
          "${RUNNER_TEMP}/module-tool-venv/bin/python" -m pip install --disable-pip-version-check 'pydantic>=2.12.0' 'tomlkit>=0.13.2'
          git init -q "${helper}"
          git -C "${helper}" remote add origin "${PIXENEOS_AVBROOT_SETUP_SOURCE:-https://github.com/0cwa/my-avbroot-setup}"
          git -C "${helper}" fetch --quiet --depth=1 origin "${VERSION[AVBROOT_SETUP]}"
          git -C "${helper}" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "${helper}" rev-parse HEAD)" = "${VERSION[AVBROOT_SETUP]}"
          "${RUNNER_TEMP}/module-tool-venv/bin/python" "${helper}/module-tool.py" lock verify --lock locks/exfatprogs-termux-v1.4.3.json

      - name: Verify deterministic exfatprogs corresponding-source bundle
        run: python3 src/ci/build_exfatprogs_source_bundle.py --output-dir "${RUNNER_TEMP}/exfatprogs-source-ci" --check-deterministic

      - name: Test exfatprogs published-scope source gate
        run: python3 tests/exfat_source_scope_test.py

      - name: Test exfatprogs image metadata diagnostics
        run: python3 tests/exfat_adapter_metadata_test.py

      - name: Test source-built Vold module contract
        run: python3 tests/lineage_vold_contract_test.py

      - name: Test byte-exact unmodified Vold reproduction contract
        run: python3 tests/lineage_vold_baseline_test.py

      - name: Test source-built Vold workflow routing
        run: python3 tests/lineage_vold_workflow_contract_test.py

      - name: Test pdx235 Custota metadata preparation
        run: bash tests/pdx235_custota_metadata_test.sh

      - name: Run deterministic tests
        shell: bash
        env:
          REQUIRE_EXFAT_SOURCE_BUNDLE: "true"
        run: |
          set -euo pipefail
          bash tests/declarations_config_test.sh
          bash tests/typed_config_resolver_test.sh
          bash tests/helper_preflight_test.sh
          bash tests/upstream_integration_test.sh
          bash tests/scheduled_build_definitions_test.sh
          bash tests/root_mode_both_test.sh
          bash tests/magisk_output_verification_test.sh
          bash tests/release_url_config_test.sh
          bash tests/release_existing_build_test.sh
          bash tests/release_existing_pair_test.sh
          bash tests/pdx235_existing_build_preflight_test.sh
          python3 tests/lineage_workflow_routing_test.py
          bash tests/provider_acquisition_test.sh
          bash tests/executable_tool_lock_test.sh
          bash tests/executable_tool_bootstrap_test.sh
          bash tests/executable_tool_routing_test.sh
          bash tests/workflow_contract_test.sh
          python3 tests/fsck_sysfs_sepolicy_registration_test.py
          bash tests/rom_contract_test.sh
          bash tests/module_selection_test.sh
          bash tests/source_care_map_policy_test.sh
          bash tests/pdx235_source_publisher_test.sh
          bash tests/pdx235_repaired_helper_test.sh
          bash tests/pdx235_release_quarantine_test.sh
          bash tests/exfat_source_asset_test.sh
          bash tests/custota_device_alias_test.sh
          python3 tests/pdx235_modular_health_test.py
          bash tests/boot_animation_config_test.sh
          bash tests/boot_animation_registration_test.sh
          python3 tests/boot_animation_test.py
          python3 tests/disable_system_updater_test.py
          bash tests/disable_system_updater_registration_test.sh
          bash tests/secrets_scan_test.sh
          bash tests/verifier_test.sh

      - name: Check upstream download endpoints
        shell: bash
        run: bash src/ci/smoke_test.sh

  # Narrow, nonpublishing Android 17 qualification on this review branch only.
  # No repository signing secrets, release credentials or write permissions.
  lineage24_qualification:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/lineage24-care-map-qualification-20261015'
    permissions:
      contents: read
    uses: ./.github/workflows/build-rom.yml
    with:
      rom-family: lineageos
      device-id: pdx235
      root: false
      root-mode: both
      magisk-preinit-device: sda47
      update-channel: nightly
      compatible-sepolicy-patching: true
      allow-unauthorized-adb: false
      microg: true
      disable-system-updater: true
      boot-animation: true
      # Exercise the ordinary provider/build path, not the opt-in fixture profile.
      development-profile: none
      signing-mode: disposable
      release-type: build-only
      publish: false

  # Manual opt-in on the owned review branch only. No publishing keys, release
  # credentials, rootless/Magisk patching, or binary-injection paths are used.
  # The runner must have a large isolated scratch volume and Android build deps.
  lineage_vold_exact_baseline:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/lineage-vold-exfat-timeout-pr' && vars.MODOS_VOLD_BASELINE_RUNNER_READY == 'true' && vars.MODOS_LINEAGE_LARGE_SCRATCH != '' }}
    runs-on: [self-hosted, linux, x64, modos-lineage-large]
    timeout-minutes: 360
    permissions:
      contents: read
    concurrency:
      group: lineage-vold-unmodified-baseline
      cancel-in-progress: false
    env:
      MODOS_LINEAGE_LARGE_SCRATCH: ${{ vars.MODOS_LINEAGE_LARGE_SCRATCH }}
    steps:
      - name: Checkout exact PR source without retained credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check isolated build host and initialize scratch workspace
        shell: bash
        run: |
          set -euo pipefail
          for tool in repo avbroot unzip debugfs curl openssl python3 git; do
            command -v "${tool}" >/dev/null || { echo "::error::Missing host tool: ${tool}"; exit 1; }
          done
          scratch="${MODOS_LINEAGE_LARGE_SCRATCH}"
          [[ "${scratch}" == /* && -d "${scratch}" && ! -L "${scratch}" ]] ||
            { echo "::error::A real absolute large scratch directory is required"; exit 1; }
          scratch="$(realpath -e -- "${scratch}")"
          echo "MODOS_LINEAGE_LARGE_SCRATCH=${scratch}" >> "${GITHUB_ENV}"
          free="$(df -PB1 -- "${scratch}" | awk 'END {print $4}')"
          (( free >= 220000000000 )) ||
            { echo "::error::Baseline source build needs at least 220GB available"; exit 1; }
          work="$(mktemp -d -- "${scratch}/modos-vold-baseline.XXXXXXXX")"
          echo "VOLD_BASELINE_WORK=${work}" >> "${GITHUB_ENV}"

      - name: Resolve exact 2026-10-16 OTA through official Lineage API
        id: official
        shell: bash
        run: python3 src/ci/resolve_lineage_vold_ota.py --output "${GITHUB_OUTPUT}"

      - name: Download, authenticate and extract original OTA vold
        shell: bash
        env:
          OTA_URL: ${{ steps.official.outputs.ota_url }}
          OTA_SHA256: ${{ steps.official.outputs.ota_sha256 }}
        run: |
          set -euo pipefail
          [[ "${OTA_SHA256}" =~ ^[0-9a-f]{64}$ ]] || exit 1
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            --output "${VOLD_BASELINE_WORK}/source.zip" "${OTA_URL}"
          bash src/ci/prepare_lineage_vold_reference.sh \
            "${VOLD_BASELINE_WORK}/source.zip" "${VOLD_BASELINE_WORK}/reference" "${OTA_SHA256}"

      - name: Sync full immutable LineageOS source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 src/ci/build_lineage_vold.py sync \
            --source-root "${VOLD_BASELINE_WORK}/source" --jobs 4

      - name: Reproduce unmodified vold and check byte-exact OTA identity
        shell: bash
        env:
          OTA_SHA256: ${{ steps.official.outputs.ota_sha256 }}
        run: |
          set -euo pipefail
          python3 src/ci/build_lineage_vold.py baseline \
            --source-root "${VOLD_BASELINE_WORK}/source" \
            --reference-vold "${VOLD_BASELINE_WORK}/reference/reference-vold" \
            --source-ota-sha256 "${OTA_SHA256}" \
            --output-dir "${VOLD_BASELINE_WORK}/baseline" --jobs 4

      - name: Preserve comparison receipt only (no signed or patched OTA)
        if: always() && env.VOLD_BASELINE_WORK != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lineage-pdx235-original-vold-baseline-report
          path: ${{ env.VOLD_BASELINE_WORK }}/baseline/baseline-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Erase isolated source and extracted images
        if: always() && env.VOLD_BASELINE_WORK != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "${VOLD_BASELINE_WORK}" == "${MODOS_LINEAGE_LARGE_SCRATCH}"/modos-vold-baseline.* ]] || exit 1
          rm -rf -- "${VOLD_BASELINE_WORK}"
