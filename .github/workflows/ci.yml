name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fallback secrets scanner
        env:
          PIXENEOS_SKIP_GITLEAKS: "true"
        run: src/scan_secrets.sh --all

      - name: Configure Android APK verification tools
        shell: bash
        run: bash src/ci/configure_android_apk_tools.sh

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.sh src/ci/*.sh tests/*.sh; do
            bash -n "${file}"
          done

      - name: ShellCheck when available
        shell: bash
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x -S warning src/main.sh src/setup_hooks.sh
          else
            echo "::notice::ShellCheck is not installed on this runner; skipping ShellCheck."
          fi

      - name: Test avbroot compatibility helper
        shell: bash
        run: bash tests/avbroot_setup_compat_test.sh --strict

      - name: Check microG release against immutable helper lock
        run: python3 src/ci/check_microg_helper_lock.py

      - name: Verify pinned exfatprogs package with image adapter
        run: python3 src/ci/check_exfatprogs_artifact.py

      - name: Verify deterministic exfatprogs corresponding-source bundle
        run: python3 src/ci/build_exfatprogs_source_bundle.py --output-dir "${RUNNER_TEMP}/exfatprogs-source-ci" --check-deterministic

      - name: Test exfatprogs published-scope source gate
        run: python3 tests/exfat_source_scope_test.py

      - name: Run deterministic tests
        shell: bash
        env:
          REQUIRE_EXFAT_SOURCE_BUNDLE: "true"
        run: |
          set -euo pipefail
          bash tests/declarations_config_test.sh
          bash tests/typed_config_resolver_test.sh
          bash tests/helper_preflight_test.sh
          bash tests/upstream_integration_test.sh
          bash tests/scheduled_build_definitions_test.sh
          bash tests/root_mode_both_test.sh
          bash tests/magisk_output_verification_test.sh
          bash tests/release_url_config_test.sh
          bash tests/release_existing_build_test.sh
          bash tests/release_existing_pair_test.sh
          bash tests/pdx235_existing_build_preflight_test.sh
          python3 tests/lineage_workflow_routing_test.py
          bash tests/provider_acquisition_test.sh
          bash tests/executable_tool_lock_test.sh
          bash tests/executable_tool_bootstrap_test.sh
          bash tests/executable_tool_routing_test.sh
          bash tests/workflow_contract_test.sh
          bash tests/rom_contract_test.sh
          bash tests/module_selection_test.sh
          bash tests/source_care_map_policy_test.sh
          bash tests/pdx235_source_publisher_test.sh
          bash tests/pdx235_repaired_helper_test.sh
          bash tests/pdx235_release_quarantine_test.sh
          bash tests/exfat_source_asset_test.sh
          bash tests/custota_device_alias_test.sh
          python3 tests/pdx235_modular_health_test.py
          bash tests/boot_animation_config_test.sh
          bash tests/boot_animation_registration_test.sh
          python3 tests/boot_animation_test.py
          python3 tests/disable_system_updater_test.py
          bash tests/disable_system_updater_registration_test.sh
          bash tests/secrets_scan_test.sh
          bash tests/verifier_test.sh

      - name: Check upstream download endpoints
        shell: bash
        run: bash src/ci/smoke_test.sh

  # Narrow, nonpublishing Android 17 qualification on this review branch only.
  # No repository signing secrets, release credentials or write permissions.
  lineage24_qualification:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/lineage24-care-map-qualification-20261015'
    permissions:
      contents: read
    uses: ./.github/workflows/build-rom.yml
    with:
      rom-family: lineageos
      device-id: pdx235
      root: false
      root-mode: both
      magisk-preinit-device: sda47
      update-channel: nightly
      compatible-sepolicy-patching: true
      allow-unauthorized-adb: false
      microg: true
      disable-system-updater: true
      boot-animation: true
      # Exercise the ordinary provider/build path, not the opt-in fixture profile.
      development-profile: none
      signing-mode: disposable
      release-type: build-only
      publish: false
