name: Upstream module APK continuity
on:
  push:
    branches: [ops/upstream-module-validation-20261013]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Configure official Android APK tools
        run: bash src/ci/configure_android_apk_tools.sh
      - name: Verify archive signatures and APK update identities
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess, tempfile, urllib.request, zipfile
          rows=[]
          with tempfile.TemporaryDirectory() as temp:
              root=pathlib.Path(temp)
              for module, repo, old, new, package in [('Custota','Custota','6.5','6.6','com.chiller3.custota'),('MSD','MSD','2.4','2.5','com.chiller3.msd')]:
                  identities=[]
                  for version in (old,new):
                      name=f'{module}-{version}-release.zip'
                      archive=root/name
                      for suffix in ('','.sig'):
                          urllib.request.urlretrieve(f'https://github.com/chenxiaolong/{repo}/releases/download/v{version}/{name}{suffix}',str(archive)+suffix)
                      with archive.open('rb') as stream:
                          subprocess.run(['ssh-keygen','-Y','verify','-f','trust/chenxiaolong.allowed_signers','-I','chenxiaolong','-n','file','-s',str(archive)+'.sig'],stdin=stream,check=True)
                      with zipfile.ZipFile(archive) as z:
                          names=[n for n in z.namelist() if n.endswith('.apk')]
                          assert len(names)==1
                          apk=root/f'{module}-{version}.apk';apk.write_bytes(z.read(names[0]))
                      output=subprocess.check_output(['apksigner','verify','--verbose','--print-certs',str(apk)],text=True)
                      certificates=set(re.findall(r'certificate SHA-256 digest: ([0-9a-fA-F:]+)',output))
                      assert len(certificates)==1,output
                      actual_package=subprocess.check_output(['apkanalyzer','manifest','application-id',str(apk)],text=True).strip()
                      code=int(subprocess.check_output(['apkanalyzer','manifest','version-code',str(apk)],text=True).strip())
                      min_sdk=int(subprocess.check_output(['apkanalyzer','manifest','min-sdk',str(apk)],text=True).strip())
                      assert actual_package==package and min_sdk<=36
                      identities.append({'version':version,'package':actual_package,'version_code':code,'min_sdk':min_sdk,'certificate_sha256':next(iter(certificates)).replace(':','').lower(),'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest()})
                  assert identities[0]['certificate_sha256']==identities[1]['certificate_sha256']
                  assert identities[1]['version_code']>identities[0]['version_code']
                  rows.append({'module':module,'apk_identity_continuity':'passed','identities':identities})
              print(json.dumps(rows,indent=2))
          PY
