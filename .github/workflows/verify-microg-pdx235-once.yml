# One-time CI and microG end-to-end validation; removed after execution.
name: Verify microG pdx235 care map fix

on:
  push:
    branches:
      - feature/microg-pdx235-20260919
    paths:
      - .github/workflows/verify-microg-pdx235-once.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Shell syntax
        run: |
          set -euo pipefail
          for file in src/*.sh src/ci/*.sh tests/*.sh; do bash -n "$file"; done
      - name: Strict helper compatibility
        run: bash tests/avbroot_setup_compat_test.sh --strict
      - name: ROM and module-selection regression tests
        run: |
          set -euo pipefail
          bash tests/rom_contract_test.sh
          bash tests/module_selection_test.sh
          bash tests/root_mode_both_test.sh
          bash tests/upstream_integration_test.sh

  reproduce:
    needs: validate
    uses: ./.github/workflows/build-rom.yml
    with:
      rom-family: lineageos
      device-id: pdx235
      root: true
      root-mode: both
      afsr: true
      magisk-preinit-device: sda47
      alterinstaller: true
      bcr: true
      custota: true
      msd: true
      oemunlockonboot: true
      microg: true
      fdroid-privileged-extension: false
      update-channel: nightly
      compatible-sepolicy-patching: true
      allow-unauthorized-adb: false
      boot-animation: true
      release-type: build-only
      publish: false
    secrets: inherit
