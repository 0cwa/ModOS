# One-shot, branch-scoped reproduction of manual run #37986167390.
# This workflow is removed after scheduling; it does not change the product defaults.
name: Verify microG pdx235 once

on:
  push:
    branches:
      - feature/microg-pdx235-20260919
    paths:
      - .github/workflows/verify-microg-pdx235-once.yml

permissions:
  contents: write

jobs:
  reproduce:
    uses: ./.github/workflows/build-rom.yml
    with:
      rom-family: lineageos
      device-id: pdx235
      root: true
      root-mode: both
      afsr: true
      magisk-preinit-device: sda47
      alterinstaller: true
      bcr: true
      custota: true
      msd: true
      oemunlockonboot: true
      microg: true
      fdroid-privileged-extension: false
      update-channel: nightly
      compatible-sepolicy-patching: true
      allow-unauthorized-adb: false
      boot-animation: true
      release-type: force-publish
      publish: true
    secrets: inherit
