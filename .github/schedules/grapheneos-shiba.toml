[device]
DEVICE_NAME = "shiba"
ROM_FAMILY = "grapheneos"
'GRAPHENEOS[UPDATE_CHANNEL]' = "stable"

[build]
ROOT = false
ROOT_MODE = "both"
MAGISK_PREINIT = "sda10"
'ADDITIONALS[AFSR]' = true
'ADDITIONALS[ALTERINSTALLER]' = true
'ADDITIONALS[BCR]' = true
'ADDITIONALS[CUSTOTA]' = true
'ADDITIONALS[MSD]' = true
'ADDITIONALS[OEMUNLOCKONBOOT]' = true
'ADDITIONALS[DISABLE_SYSTEM_UPDATER]' = true
'ADDITIONALS[FDROID_PRIVILEGED_EXTENSION]' = false
'ADDITIONALS[BOOT_ANIMATION]' = true
'ADDITIONALS[MAS_COMPATIBLE_SEPOLICY]' = false
# These modules are only supported on LineageOS pdx235, not GrapheneOS.
'ADDITIONALS[EXFATPROGS_FSCK]' = false
'ADDITIONALS[FSCK_SYSFS_SEPOLICY]' = false
'ADDITIONALS[LINEAGE_VOLD_EXFAT_TIMEOUT]' = false  # pending independent binary qualification
FORCE_UPDATE = false
