class process { dyntransition transition }
class file { getattr ioctl open read write }
class dir { read search }
type fsck_untrusted;
type sysfs;
type keep_t;
allow fsck_untrusted sysfs : dir read;
auditallow fsck_untrusted sysfs : dir read;
dontaudit fsck_untrusted sysfs : dir read;
allow keep_t keep_t : file write;
role sys_role;
role sys_role types { fsck_untrusted sysfs keep_t };
user sys_user roles { sys_role };
sid kernel sys_user:sys_role:fsck_untrusted
